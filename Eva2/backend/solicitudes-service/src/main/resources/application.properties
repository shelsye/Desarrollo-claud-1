spring.application.name=mesatech-solicitudes-service

server.port=8081

# =========================
# BASE DE DATOS - RDS SOLICITUDES
# =========================
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/mesatech_solicitudes?useSSL=false&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# =========================
# RABBITMQ - CONSUMIDOR
# =========================
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:solicitudes_app}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:}
spring.rabbitmq.virtual-host=${RABBITMQ_VHOST:mesatech}

# Listener
spring.rabbitmq.listener.simple.acknowledge-mode=AUTO
spring.rabbitmq.listener.simple.prefetch=1